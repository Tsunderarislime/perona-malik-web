<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Perona-Malik</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" 
            rel="stylesheet" 
            integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" 
            crossorigin="anonymous">
        
        <script defer src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js" integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css" rel="stylesheet">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Liter&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: "Liter", serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
        }
        .form-control {max-width: 25%;}
        .form-range {max-width: 25%;}
        .navbar {padding: 0.5%;}
        .slider-with-shadows {
            --divider-width: 3px;
            --divider-color: rgba(220, 220, 220, 0.85);
            --default-handle-shadow: 0px 0px 5px rgba(0, 0, 0, 0.75);
            --divider-shadow: 0px 0px 5px rgba(0, 0, 0, 0.5);
        }
        body {
            background-size: 80px 80px;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 1px, transparent 1px);
        }

        .container {
            background-color: rgba(255, 255, 255, 0.5);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
        }

        /* HTML: <div class="loader"></div> */
        .loader {
            width: 50px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 8px solid;
            border-color: #000 #0000;
            animation: l1 1s infinite;
        }
        @keyframes l1 {to{transform: rotate(.5turn)}}
    </style>
    
    </head>

    <body>
        <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body mb-2 px-3" data-bs-theme="dark">
            <a class="navbar-brand" href="{{ url_for('index') }}">Perona-Malik</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-supported-content" aria-controls="navbar-supported-content" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar-supported-content">
                <ul class="navbar-nav mb-2 mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="https://tsunderarislime.github.io">My Page</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://github.com/Tsunderarislime/perona-malik-web">GitHub</a>
                </li>
            </div>
        </nav>
        <div class="container p-5 border border-3 border-primary rounded-3" style="--bs-border-opacity: .5;">
            {% block content %} {% endblock %}
        </div>

        <!-- Loading modal after submitting parameters -->
        <div class="modal fade" id="loading" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="loading-label" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="loading-label">Processing...</h1>
                    </div>
                    <div class="modal-body">
                        <div class="mx-auto loader"></div>
                    </div>
                </div>
            </div>
        </div>
    
        <script>
            const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
            const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))

            var loadingModalElement = document.getElementById("loading");
            var loadingModal = new bootstrap.Modal(loadingModalElement);

            function loading() {
                loadingModal.toggle();
            }
        </script>
        
    </body>
</html>
